name: supportflow
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh}
      POSTGRES_DB: supportflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow"]
      interval: 5s
      retries: 12

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12
    # NVIDIA GPU (optional, needs nvidia-container-toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  model-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    entrypoint: ["/bin/sh", "-c", "ollama pull $${CHAT_MODEL} && ollama pull $${EMBED_MODEL}"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://supportflow:${POSTGRES_PASSWORD}@postgres:5432/supportflow
      OLLAMA_URL: http://ollama:11434
      API_KEY: ${API_KEY:?run scripts/init-env.sh}
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-fa}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.5}
      ESCALATION_CONFIDENCE: ${ESCALATION_CONFIDENCE:-0.6}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
    ports:
      - "127.0.0.1:8000:8000"

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run scripts/init-env.sh}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_SECURE_COOKIE: "false"   # set true behind HTTPS
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: Asia/Tehran
      TZ: Asia/Tehran
      SUPPORTFLOW_API_KEY: ${API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?run scripts/init-env.sh}
      ESCALATION_WEBHOOK_URL: ${ESCALATION_WEBHOOK_URL:-}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

volumes:
  pgdata:
  ollama:
  n8n:
