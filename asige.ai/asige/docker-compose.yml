services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: asige, POSTGRES_PASSWORD: asige, POSTGRES_DB: asige}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U asige"], interval: 5s, retries: 10}
  redis:
    image: redis:7
  api:
    build: .
    env_file: .env
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_started}}
    ports: ["8000:8000"]
  worker:
    build: .
    env_file: .env
    command: celery -A asige.tasks worker -l info --concurrency=2
    depends_on: [api, redis]
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes:
  pgdata:
