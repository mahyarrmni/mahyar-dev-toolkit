<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 110" width="860" height="110">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="860" height="110" fill="#0d1117" rx="10"/>

  <!-- Row 1 labels -->
  <g font-family="ui-monospace,monospace" font-size="11.5" fill="#c9d1d9">
    <!-- WordPress -->
    <rect x="14" y="14" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="69" y="37" text-anchor="middle" fill="#58a6ff">WordPress</text>

    <!-- PHP -->
    <rect x="134" y="14" width="80" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="174" y="37" text-anchor="middle" fill="#7ee787">PHP</text>

    <!-- Python -->
    <rect x="224" y="14" width="90" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="269" y="37" text-anchor="middle" fill="#f0883e">Python</text>

    <!-- Gemini API -->
    <rect x="324" y="14" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="379" y="37" text-anchor="middle" fill="#a371f7">Gemini API</text>

    <!-- LLM Agents -->
    <rect x="444" y="14" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="499" y="37" text-anchor="middle" fill="#58a6ff">LLM Agents</text>

    <!-- Playwright -->
    <rect x="564" y="14" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="619" y="37" text-anchor="middle" fill="#7ee787">Playwright</text>

    <!-- Streamlit -->
    <rect x="684" y="14" width="100" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="734" y="37" text-anchor="middle" fill="#f0883e">Streamlit</text>
  </g>

  <!-- Row 2 -->
  <g font-family="ui-monospace,monospace" font-size="11.5" fill="#c9d1d9">
    <rect x="14" y="60" width="100" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="64" y="83" text-anchor="middle" fill="#a371f7">Technical SEO</text>

    <rect x="124" y="60" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="179" y="83" text-anchor="middle" fill="#58a6ff">Elementor Pro</text>

    <rect x="244" y="60" width="110" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="299" y="83" text-anchor="middle" fill="#7ee787">WooCommerce</text>

    <rect x="364" y="60" width="90" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="409" y="83" text-anchor="middle" fill="#f0883e">JavaScript</text>

    <rect x="464" y="60" width="80" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="504" y="83" text-anchor="middle" fill="#58a6ff">MySQL</text>

    <rect x="554" y="60" width="130" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="619" y="83" text-anchor="middle" fill="#a371f7">Search Console API</text>

    <rect x="694" y="60" width="90" height="36" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1"/>
    <text x="739" y="83" text-anchor="middle" fill="#7ee787">REST API</text>
